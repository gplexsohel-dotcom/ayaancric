<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scoring</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0e0e0e;color:#fff;max-width:480px;margin:0 auto}.h{padding:12px;background:#111;display:flex;gap:10px;align-items:center}.score{background:#ff2a3c;padding:16px;text-align:center}.score h1{font-size:32px}.b{font-size:12px;opacity:.9}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px}.btn{background:#1e1e1e;border:1px solid #333;color:#fff;padding:18px;border-radius:12px;font-size:18px;font-weight:700}.btn.w{background:#ff2a3c}.card{background:#161616;margin:0 16px 12px;border-radius:12px;padding:12px;font-size:13px}.over{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.ball{width:28px;height:28px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}</style></head><body><div class="h"><a href="start-match.html" style="color:#fff;text-decoration:none">←</a><b id="t">Scoring</b></div><div class="score"><h1 id="s">0/0</h1><div class="b" id="ov">0.0 Ov • 0 Runs • RR 0.00</div><div class="b" id="teams">ROYALS XI vs KNIGHTS CC</div></div><div class="card"><b>This Over:</b><div class="over" id="thisOver"></div></div><div class="grid"><button class="btn" onclick="add(0)">0</button><button class="btn" onclick="add(1)">1</button><button class="btn" onclick="add(2)">2</button><button class="btn" onclick="add(3)">3</button><button class="btn" onclick="add(4)">4</button><button class="btn" onclick="add(6)">6</button><button class="btn" onclick="add('W')" style="background:#444">W</button><button class="btn w" onclick="add('Wd')">Wd</button><button class="btn w" onclick="add('Nb')">Nb</button><button class="btn" onclick="add('1Wd')">1Wd</button><button class="btn" onclick="undo()">UNDO</button><button class="btn" style="background:#222" onclick="location.href='index.html'">END</button></div><script>let runs=0,wickets=0,balls=0,overBalls=[],hist=[];let teamA=localStorage.getItem('teamA')||'ROYALS XI';let teamB=localStorage.getItem('teamB')||'KNIGHTS CC';document.getElementById('teams').innerText=teamA+' vs '+teamB;function render(){let ov=Math.floor(balls/6)+'.'+(balls%6);let rr=balls? (runs/(balls/6)).toFixed(2):'0.00';document.getElementById('s').innerText=runs+'/'+wickets;document.getElementById('ov').innerText=ov+' Ov • '+runs+' Runs • RR '+rr;document.getElementById('thisOver').innerHTML=overBalls.map(b=>'<div class=ball>'+b+'</div>').join('')}function add(v){hist.push({runs,wickets,balls,over:[...overBalls]});if(v=='W'){wickets++;balls++;overBalls.push('W')}else if(v=='Wd'){runs+=1;overBalls.push('Wd')}else if(v=='Nb'){runs+=1;overBalls.push('Nb')}else if(v=='1Wd'){runs+=2;overBalls.push('1Wd')}else{runs+=v;balls++;overBalls.push(v)}if(balls%6==0&&balls!=0&&typeof v!=='string')overBalls=[];render()}function undo(){if(!hist.length)return;let h=hist.pop();runs=h.runs;wickets=h.wickets;balls=h.balls;overBalls=h.over;render()}render()</script></body></html>
