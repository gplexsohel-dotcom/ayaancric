<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scorecard</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#0a0a0a;color:#fff;max-width:480px;margin:0 auto}.h{padding:14px;background:#111;display:flex;gap:10px}.top{background:#ff2a3c;padding:20px;text-align:center}.top h1{font-size:36px}.card{background:#161616;margin:12px 16px;border-radius:14px;padding:14px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222;font-size:14px}.b{width:100%;background:#ff2a3c;border:0;color:#fff;padding:15px;border-radius:12px;font-weight:800;margin:12px 16px;width:calc(100% - 32px)}</style></head><body>
<div class="h"><a href="scoring.html" style="color:#fff;text-decoration:none">←</a><b>Match Summary</b></div>
<div class="top"><h1 id="sc">0/0</h1><div id="ov">0.0 Ov</div><div id="tm" style="font-size:12px;margin-top:6px;opacity:.9">ROYALS XI vs KNIGHTS CC</div></div>
<div class="card"><b>Scorecard</b><div class="row"><span>ROYALS XI</span><span id="runs">0 Runs</span></div><div class="row"><span>Overs</span><span id="overs">0.0</span></div><div class="row"><span>Run Rate</span><span id="rr">0.00</span></div><div class="row"><span>Extras</span><span id="ex">0</span></div><div class="row"><span>Wickets</span><span id="wk">0</span></div></div>
<div class="card"><b>Ball by Ball</b><div id="balls" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"></div></div>
<button class="b" onclick="location.href='index.html'">🏠 New Match</button>
<script>let r=parseInt(localStorage.getItem('final_runs')||'0');let w=parseInt(localStorage.getItem('final_wk')||'0');let b=parseInt(localStorage.getItem('final_balls')||'0');let ex=parseInt(localStorage.getItem('final_extras')||'0');let hist=JSON.parse(localStorage.getItem('final_history')||'[]');let tA=localStorage.getItem('teamA')||'ROYALS XI';let tB=localStorage.getItem('teamB')||'KNIGHTS CC';document.getElementById('sc').innerText=r+'/'+w;document.getElementById('ov').innerText=Math.floor(b/6)+'.'+(b%6)+' Ov';document.getElementById('tm').innerText=tA+' vs '+tB;document.getElementById('runs').innerText=r+' Runs';document.getElementById('overs').innerText=Math.floor(b/6)+'.'+(b%6);document.getElementById('rr').innerText=b?(r/(b/6)).toFixed(2):'0.00';document.getElementById('ex').innerText=ex;document.getElementById('wk').innerText=w;document.getElementById('balls').innerHTML=hist.map(x=>'<div style="width:30px;height:30px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px">'+x+'</div>').join('')</script>
</body></html>
