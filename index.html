<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayaan Cric</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;max-width:480px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;padding:12px 0}
.live{border:1.5px solid #ff2a3c;border-radius:16px;padding:14px;margin:10px 0;background:#111}
.btn{background:#ff2a3c;color:#fff;border:0;padding:12px;border-radius:20px;width:100%;font-weight:800;margin-top:10px}
.small{font-size:12px;color:#888}
.card{background:#161616;border:1px solid #222;border-radius:14px;padding:12px;margin:8px 0}
</style>
</head>
<body>
<div class="top"><b>Ayaan Cric</b><span>🔴 LIVE</span></div>

<div class="live">
<div class="small" style="color:#ff2a3c">● LIVE • Mymensingh</div>
<b id="teamNames">AYAN XI vs Mymensingh Stars</b>
<h1 style="font-size:32px;margin:8px 0"><span id="hRuns">0</span>/<span id="hWk">0</span> (<span id="hOv">0.0</span> ov)</h1>
<div class="small" id="hInfo">CRR: 0.00 • Tap View to Score</div>
<button class="btn" onclick="location.href='scoring.html'">View Live Scoreboard →</button>
</div>

<div style="display:flex;gap:8px">
<div class="card" style="flex:1;text-align:center" onclick="location.href='start-match.html'">▶ Start<br><span class="small">New Match</span></div>
<div class="card" style="flex:1;text-align:center" onclick="location.href='scoring.html'">🏏 Score<br><span class="small">Live</span></div>
<div class="card" style="flex:1;text-align:center">📊 History<br><span class="small">Matches</span></div>
</div>

<script>
let fr=localStorage.getItem('final_runs')||localStorage.getItem('current_runs')||'0';
let fw=localStorage.getItem('final_wk')||localStorage.getItem('current_wk')||'0';
let fb=parseInt(localStorage.getItem('final_balls')||localStorage.getItem('current_balls')||'0');
let ta=localStorage.getItem('teamA')||'AYAN XI';
let tb=localStorage.getItem('teamB')||'Mymensingh Stars';
document.getElementById('teamNames').innerText=ta+' vs '+tb;
document.getElementById('hRuns').innerText=fr;
document.getElementById('hWk').innerText=fw;
document.getElementById('hOv').innerText=Math.floor(fb/6)+'.'+(fb%6);
document.getElementById('hInfo').innerText='CRR: '+(fb>0?(fr/(fb/6)).toFixed(2):'0.00')+' • '+ta+' Batting';
</script>
</body>
</html>
