<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AYAANCRIC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#0c0c0c;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#121212;min-height:100vh;display:flex;flex-direction:column;position:relative}
.top{background:#1a1a1a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{color:#00ff88;font-weight:900;font-size:22px;letter-spacing:1px}
.logo span{color:#fff}
.profile{display:flex;align-items:center;gap:8px}
.pro-icon{width:32px;height:32px;background:#00d95f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000}
.content{flex:1;padding:16px;padding-bottom:90px}
.banner{background:linear-gradient(135deg,#1e1e1e 0%,#2a2a2a 100%);border:1px solid #333;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.banner-text{color:#fff}
.banner-text b{font-size:18px;display:block}
.banner-text small{color:#888;font-size:12px}
.banner button{background:#e11a2e;color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border-radius:16px;padding:18px 14px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:1px solid rgba(255,255,255,0.1)}
.box b{color:#fff;font-size:15px}
.box small{color:rgba(255,255,255,0.7);font-size:11px;margin-top:4px}
.b1{background:linear-gradient(135deg,#ff3a3a,#cc0000)}
.b2{background:linear-gradient(135deg,#2e7d32,#1b5e20)}
.b3{background:linear-gradient(135deg,#1565c0,#0d47a1)}
.b4{background:linear-gradient(135deg,#ff8c1a,#ef6c00)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#171717;border-top:1px solid #2a2a2a;display:flex;justify-content:space-around;padding:8px 0 12px 0;z-index:99}
.b-item{display:flex;flex-direction:column;align-items:center;color:#666;font-size:10px;gap:3px;text-decoration:none;flex:1}
.b-item.active{color:#00ff88}
.b-item i{font-size:20px;font-style:normal}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div class="logo">AYAAN<span>CRIC</span></div>
<div class="profile"><div class="pro-icon">A</div></div>
</div>
<div class="content">
<div class="banner">
<div class="banner-text"><b>AYAN XI vs Mymensingh Stars</b><small>Today • Start scoring now</small></div>
<button onclick="location.href='scoring.html'">Score</button>
</div>
<div class="grid">
<div class="box b1" onclick="location.href='start-match.html'"><div><b>Start New Match</b><br><small>Create & schedule a match</small></div><div style="text-align:right;font-size:24px">🏏</div></div>
<div class="box b2" onclick="location.href='scoring.html'"><div><b>Scoring</b><br><small>Live ball by ball</small></div><div style="text-align:right;font-size:24px">📝</div></div>
<div class="box b3" onclick="location.href='scorecard.html'"><div><b>Scorecard</b><br><small>View full scorecard</small></div><div style="text-align:right;font-size:24px">📊</div></div>
<div class="box b4" onclick="location.href='my-teams.html'"><div><b>My Teams</b><br><small>Admin & players</small></div><div style="text-align:right;font-size:24px">👥</div></div>
</div>
</div>
<div class="bottom">
<a class="b-item active" href="index.html"><i>🏠</i>Home</a>
<a class="b-item" href="my-teams.html"><i>👥</i>Teams</a>
<a class="b-item" href="start-match.html"><i>➕</i>Match</a>
<a class="b-item" href="scorecard.html"><i>📊</i>Stats</a>
</div>
</div>
</body>
</html>
