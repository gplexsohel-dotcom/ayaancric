<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ayaan Cric</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#0a0a0a;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column}
.top{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#0a0a0a;border-bottom:1px solid #1a1a1a}
.top-left{display:flex;align-items:center;gap:10px}
.ac-logo{width:44px;height:44px;border:2px solid #ff1a1a;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#ff1a1a;font-weight:900;font-size:16px;background:#1a0a0a}
.app-name{color:#fff;font-weight:700;font-size:18px}
.out-btn{width:48px;height:48px;background:#e11a2e;border-radius:50%;border:none;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hello{padding:20px 16px 12px 16px}
.hello h2{color:#fff;font-size:26px;font-weight:800}
.hello p{color:#666;font-size:13px;margin-top:4px;display:flex;align-items:center;gap:6px}
.live-box{margin:12px 16px;background:#151515;border:1px solid #222;border-radius:14px;padding:14px}
.live-dot{color:#ff1a1a;font-size:12px;font-weight:800;letter-spacing:1px}
.live-match{color:#fff;font-weight:700;font-size:15px;margin-top:6px}
.live-info{color:#666;font-size:12px;margin-top:3px}
.grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:90px}
.card{border-radius:20px;padding:22px 14px;min-height:145px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.card-icon{font-size:42px;margin-bottom:12px}
.card b{color:#fff;font-size:17px;font-weight:700}
.card small{color:rgba(255,255,255,0.8);font-size:12px;margin-top:3px}
.c1{background:linear-gradient(135deg,#00c853,#009624)}
.c2{background:linear-gradient(135deg,#ef5350,#c62828)}
.c3{background:linear-gradient(135deg,#42a5f5,#1565c0)}
.c4{background:linear-gradient(135deg,#ffa726,#ef6c00)}
</style>
</head>
<body>
<div class="app">
<div class="top">
<div class="top-left">
<div class="ac-logo">AC</div>
<div class="app-name">Ayaan Cric</div>
</div>
<button class="out-btn" onclick="signOut()">OUT</button>
</div>

<div class="hello">
<h2>Hello, Ayaan 👋</h2>
<p>👤 01856262395</p>
</div>

<div class="live-box" onclick="location.href='scoring.html'">
<div class="live-dot">● LIVE</div>
<div class="live-match">Ayaan XI vs Friends XI</div>
<div class="live-info">32/1 • Need 45 runs • 2.3 overs</div>
</div>

<div class="grid">
<div class="card c1" onclick="location.href='start-match.html'">
<div class="card-icon">🏏</div>
<b>Start Match</b>
<small>Begin new match</small>
</div>
<div class="card c2" onclick="location.href='scoring.html'">
<div class="card-icon">✏️</div>
<b>Scoring</b>
<small>Ball-by-ball</small>
</div>
<div class="card c3" onclick="location.href='scorecard.html'">
<div class="card-icon">📊</div>
<b>Scorecard</b>
<small>View stats</small>
</div>
<div class="card c4" onclick="location.href='my-teams.html'">
<div class="card-icon">👥</div>
<b>My Teams</b>
<small>Manage squads</small>
</div>
</div>
</div>
<script>
function signOut(){
if(confirm('Sign out?')){
localStorage.removeItem('ayaan_phone');
localStorage.removeItem('ayaan_name');
location.href='login.html';
}
}
</script>
</body>
</html>
