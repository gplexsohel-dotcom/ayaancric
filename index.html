<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start New Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0c0c0c;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#121212;min-height:100vh;display:flex;flex-direction:column}
.hdr{padding:14px 16px;background:#171717;display:flex;gap:12px;align-items:center;border-bottom:1px solid #222;color:#fff}
.hdr a{color:#888;text-decoration:none}
.box{margin:12px 16px;background:#1e1e1e;padding:14px;border-radius:14px;border:1px solid #2a2a2a}
.lb{color:#888;font-size:12px;margin-bottom:6px;display:block}
.inp{width:100%;background:#121212;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;outline:none;font-size:14px;margin-bottom:12px}
.inp::placeholder{color:#555}
.pl-row{display:flex;gap:8px;margin-bottom:10px}
.pl-row .inp{margin-bottom:0;flex:1}
.del{width:48px;background:#2a1e1e;border:1px solid #333;border-radius:10px;color:#ff4d4d;cursor:pointer}
.add{width:100%;background:transparent;border:1px dashed #333;color:#00d95f;padding:12px;border-radius:10px;cursor:pointer;font-weight:700}
.title{color:#fff;font-size:18px;font-weight:800;margin-bottom:12px}
.start{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;height:58px;background:#e11a2e;border:none;color:#fff;font-size:18px;font-weight:800;cursor:pointer;z-index:10}
.content{padding-bottom:70px;flex:1}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
<a href="index.html">← Back</a>
<b>Start New Match</b>
</div>
<div class="content">
<div class="box">
<span class="lb">Team A Name</span>
<input class="inp" id="teamA" placeholder="Enter Team A Name" value="">
<span class="lb">Team B Name</span>
<input class="inp" id="teamB" placeholder="Enter Team B Name" value="">
</div>

<div class="box">
<div class="title" id="teamATitle">Team A Players</div>
<div id="teamAPlayers">
<div class="pl-row"><input class="inp" placeholder="Player 1" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 2" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 3" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 4" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 5" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
</div>
<button class="add" onclick="addPlayer('teamAPlayers')">+ Add Player to Team A</button>
</div>

<div class="box">
<div class="title" id="teamBTitle">Team B Players</div>
<div id="teamBPlayers">
<div class="pl-row"><input class="inp" placeholder="Player 1" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 2" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 3" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 4" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
<div class="pl-row"><input class="inp" placeholder="Player 5" value=""><button class="del" onclick="this.parentElement.remove()">x</button></div>
</div>
<button class="add" onclick="addPlayer('teamBPlayers')">+ Add Player to Team B</button>
</div>
</div>
<button class="start" onclick="startMatch()">Start Match →</button>
</div>
