<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaan Cric</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0c0c0c;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#121212;min-height:100vh;display:flex;flex-direction:column;position:relative}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#171717;border-bottom:1px solid #222}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800}
.sh{width:36px;height:36px;border:2px solid #e11a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#e11a2e;font-weight:900;font-size:13px}
.out{width:34px;height:34px;background:#e11a2e;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:800;border:none}
.hello{padding:12px 16px}
.hello h2{color:#fff;font-size:20px}
.hello p{color:#888;font-size:12px;margin-top:2px}
.card{margin:6px 16px;background:#1e1e1e;padding:10px 14px;border-radius:10px;color:#fff;border:1px solid #2a2a2a}
.live{color:#e11a2e;font-size:10px;font-weight:700}
.match{font-size:14px;font-weight:700;margin-top:2px}
.score{color:#888;font-size:11px;margin-top:2px}
.content{flex:1;padding-bottom:75px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px}
.box{padding:18px 8px;border-radius:16px;text-align:center;color:#fff;cursor:pointer}
.box .icon{font-size:32px;display:block;margin-bottom:6px}
.box .title{font-size:15px;font-weight:800}
.box .sub{font-size:10px;opacity:.8;margin-top:2px}
.b1{background:linear-gradient(135deg,#0d7a3a,#00d95f)}
.b2{background:linear-gradient(135deg,#9b1a2a,#ff2d47)}
.b3{background:linear-gradient(135deg,#1a4fb5,#3a8bff)}
.b4{background:linear-gradient(135deg,#9a4a00,#ff8c1a)}
.bot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;height:65px;background:#171717;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:100}
.bot div{color:#666;font-size:10px;text-align:center}
.bot .a{color:#e11a2e}
</style>
</head>
<body>
<div class="app">
<div class="content">
<div class="hdr">
<div class="logo"><div class="sh">AC</div>Ayaan Cric</div>
<button class="out" onclick="doOut()">OUT</button>
</div>
<div class="hello">
<h2>Hello, Ayaan 👋</h2>
<p id="ph">👤 01856262395</p>
</div>
<div class="card">
<div class="live">● LIVE</div>
<div class="match">Ayaan XI vs Friends XI</div>
<div class="score">32/1 • Need 45 runs • 2.3 overs</div>
</div>
<div class="grid">
<div class="box b1" onclick="location.href='start-match.html'">
<span class="icon">🏏</span>
<div class="title">Start Match</div>
<div class="sub">Begin new match</div>
</div>
<div class="box b2" onclick="location.href='scoring.html'">
<span class="icon">✏️</span>
<div class="title">Scoring</div>
<div class="sub">Ball-by-ball</div>
</div>
<div class="box b3" onclick="location.href='scorecard.html'">
<span class="icon">📊</span>
<div class="title">Scorecard</div>
<div class="sub">View stats</div>
</div>
<div class="box b4">
<span class="icon">👥</span>
<div class="title">My Teams</div>
<div class="sub">Manage squads</div>
</div>
</div>
</div>
<div class="bot">
<div class="a">🏠<br>Home</div>
<div>👑<br>Pro</div>
<div>🏏<br>Cricket</div>
<div>🔴<br>Live</div>
<div>🔭<br>Look</div>
</div>
</div>
<script>
if(localStorage.getItem('ayaan_logged')!='yes'){location.href='login.html';}
var p=localStorage.getItem('ayaan_phone')||'01856262395';
document.getElementById('ph').innerText='👤 '+p;
function doOut(){if(confirm('Sign Out?')){localStorage.clear();location.href='login.html';}}
</script>
</body>
</html>
