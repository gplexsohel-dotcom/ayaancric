<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayaan Cric</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0c0c0c;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#121212;min-height:100vh;padding-bottom:80px}
.hdr{display:flex;justify-content:space-between;padding:16px;background:#171717}
.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800}
.sh{width:40px;height:40px;border:2px solid #e11a2e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#e11a2e;font-weight:900}
.btn{position:fixed;bottom:70px;right:10px;background:#e11a2e;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:700}
.card{margin:12px 16px;background:#1e1e1e;padding:14px;border-radius:12px;color:#fff;border:1px solid #333}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.grid div{background:#1e1e1e;padding:14px;border-radius:10px;text-align:center;color:#fff;border:1px solid #333}
</style>
</head>
<body>
<div class="app">
<div class="hdr"><div class="logo"><div class="sh">AC</div>Ayaan Cric</div><div id="u" style="color:#fff;font-size:11px"></div></div>
<div style="padding:16px;color:#fff"><h2>Hello, Ayaan 👋</h2><p style="color:#888;font-size:12px" id="ph">Welcome</p></div>
<div class="card"><b style="color:#e11a2e">● LIVE</b><div style="margin-top:6px">Ayaan XI vs Friends XI</div><div style="color:#888;font-size:11px">32/1 • Need 45</div></div>
<div class="grid"><div onclick="location.href='start-match.html'">Start Match</div><div onclick="location.href='scoring.html'">Scoring</div><div onclick="location.href='scorecard.html'">Scorecard</div><div>My Teams</div></div>
</div>
<button class="btn" onclick="localStorage.clear();location.href='login.html'">Sign Out</button>
<script>
if(localStorage.getItem('ayaan_logged')!='yes')location.href='login.html';
document.getElementById('u').innerText=localStorage.getItem('ayaan_phone')||'';
document.getElementById('ph').innerText='👤 '+ (localStorage.getItem('ayaan_phone')||'');
</script>
</body>
</html>
