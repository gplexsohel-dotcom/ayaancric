<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ayaan Cric</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif
}
body{
  background:#0c0c0c;
  display:flex;
  justify-content:center
}
.app{
  width:100%;
  max-width:420px;
  background:#121212;
  min-height:100vh;
  display:flex;
  flex-direction:column
}
.hdr{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  background:#171717;
  border-bottom:1px solid #222
}
.logo{
  display:flex;
  gap:10px;
  align-items:center;
  color:#fff;
  font-weight:800
}
.sh{
  width:38px;
  height:38px;
  border:2px solid #e11a2e;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e11a2e;
  font-weight:900
}
.out{
  width:36px;
  height:36px;
  background:#e11a2e;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:10px;
  font-weight:800;
  cursor:pointer
}
.hello{
  padding:16px
}
.hello h2{
  color:#fff;
  font-size:22px
}
.card{
  margin:8px 16px;
  background:#1e1e1e;
  padding:14px;
  border-radius:12px;
  color:#fff;
  border:1px solid #2a2a2a
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:12px 16px
}
.grid div{
  background:#1e1e1e;
  padding:18px 10px;
  border-radius:12px;
  text-align:center;
  color:#fff;
  border:1px solid #2a2a2a
}
.content{
  flex:1
}
.bot{
  height:65px;
  background:#171717;
  border-top:1px solid #222;
  display:flex;
  justify-content:space-around;
  align-items:center
}
.bot div{
  color:#666;
  font-size:10px;
  text-align:center
}
.bot .a{
  color:#e11a2e
}
</style>
</head>
<body>
<div class="app">
  <div class="content">
    <div class="hdr">
      <div class="logo">
        <div class="sh">AC</div>
        Ayaan Cric
      </div>
      <div class="out" onclick="doOut()">OUT</div>
    </div>
    <div class="hello">
      <h2>Hello, Ayaan 👋</h2>
      <p id="ph">👤 Welcome</p>
    </div>
    <div class="card">
      <div style="color:#e11a2e;font-size:11px">● LIVE</div>
      <div style="font-weight:700;margin-top:6px">Ayaan XI vs Friends XI</div>
      <div style="color:#888;font-size:11px">32/1 • Need 45</div>
    </div>
    <div class="grid">
      <div onclick="location.href='start-match.html'">Start Match</div>
      <div onclick="location.href='scoring.html'">Scoring</div>
      <div onclick="location.href='scorecard.html'">Scorecard</div>
      <div>My Teams</div>
    </div>
  </div>
  <div class="bot">
    <div class="a">🏠<br>Home</div>
    <div>👑<br>Pro</div>
    <div>🏏<br>Cricket</div>
    <div>🔴<br>Live</div>
    <div>🔭<br>Look</div>
  </div>
</div>
<script>
if(localStorage.getItem('ayaan_logged')!='yes'){
  location.href='login.html';
}
document.getElementById('ph').innerText='👤 '+(localStorage.getItem('ayaan_phone')||'');
function doOut(){
  if(confirm('Sign Out?')){
    localStorage.clear();
    location.href='login.html';
  }
}
</script>
</body>
</html>
