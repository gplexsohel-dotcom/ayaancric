<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Teams</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0c0c0c;display:flex;justify-content:center}
.app{width:100%;max-width:420px;background:#121212;min-height:100vh}
.hdr{padding:14px 16px;background:#171717;display:flex;gap:12px;align-items:center;color:#fff}
.hdr a{color:#888;text-decoration:none}
.content{padding:16px;padding-bottom:80px}
.box{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:14px;padding:14px;margin-bottom:12px}
.inp{width:100%;background:#121212;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin-bottom:10px}
.btn{width:100%;background:#e11a2e;color:#fff;padding:12px;border:none;border-radius:10px;font-weight:800}
.admin{font-size:9px;background:#ff8c1a;color:#000;padding:2px 6px;border-radius:10px;font-weight:800}
.member{background:#121212;border:1px solid #333;padding:10px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="app">
<div class="hdr"><a href="index.html">← Back</a><b>My Teams Admin</b></div>
<div class="content">
<div class="box">
<input class="inp" id="teamName" placeholder="Team Name e.g AYAN XI">
<button class="btn" onclick="createTeam()">Create Team + You Are Admin 👑</button>
</div>
<div id="list"></div>
</div>
</div>
<script>
let phone=localStorage.getItem('ayaan_phone')||'01856262395';
let teams=JSON.parse(localStorage.getItem('ayaan_teams')||'[]');
function save(){localStorage.setItem('ayaan_teams',JSON.stringify(teams));show()}
function createTeam(){
let n=document.getElementById('teamName').value;
if(!n)return alert('Enter name');
teams.push({id:Date.now(),name:n,members:[{name:'Ayaan',phone:phone,isAdmin:true}]});
save();document.getElementById('teamName').value='';
}
function makeAdmin(tid,ph){
let t=teams.find(x=>x.id==tid);
let me=t.members.find(m=>m.phone==phone);
if(!me.isAdmin)return alert('Only Admin can do!');
t.members.find(m=>m.phone==ph).isAdmin=!t.members.find(m=>m.phone==ph).isAdmin;
save();
}
function show(){
let h='';
teams.forEach(t=>{
h+=`<div class=box><b style=color:#fff>${t.name}</b><br>`;
t.members.forEach(m=>{
h+=`<div class=member><div><div style=color:#fff>${m.name} ${m.isAdmin?'<span class=admin>ADMIN</span>':''}</div><div style=color:#888;font-size:11px>${m.phone}</div></div><div>${m.phone!=phone?`<button onclick=makeAdmin(${t.id},'${m.phone}') style=background:#ff8c1a;border:none;padding:6px 8px;border-radius:6px;font-size:11px>${m.isAdmin?'Remove':'Make Admin'}</button>`:''}</div></div>`;
});
h+=`<button onclick="let n=prompt('Name?');let p=prompt('Phone?');if(n&&p){let tt=teams.find(x=>x.id==${t.id});tt.members.push({name:n,phone:p,isAdmin:false});save()}" style="margin-top:10px;width:100%;padding:10px;background:#00d95f;border:none;border-radius:8px;font-weight:700">+ Add Player (Admin Only)</button></div>`;
});
document.getElementById('list').innerHTML=h;
}
show();
</script>
</body>
</html>
