<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Start Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a0a0a;color:#fff;max-width:480px;margin:0 auto;padding:14px}
.top{padding:12px 0;display:flex;gap:10px}
input{width:100%;background:#161616;border:1.5px solid #333;color:#fff;padding:12px;border-radius:10px;margin:6px 0}
.card{background:#161616;border:1px solid #222;border-radius:16px;padding:14px;margin:12px 0}
.btn{width:100%;background:#ff2a3c;color:#fff;border:0;padding:14px;border-radius:24px;font-weight:800;font-size:16px;margin-top:10px}
label{font-size:12px;color:#888}
b{font-size:14px}
</style>
</head>
<body>
<div class="top"><span onclick="location.href='index.html'">← Back</span><b>Start New Match</b></div>

<div class="card">
<label>Team A Name</label>
<input id="teamA" value="AYAN XI">
<label>Team B Name</label>
<input id="teamB" value="Mymensingh Stars">
</div>

<div class="card">
<b>AYAN XI Players</b>
<input id="p1" value="Ayaan">
<input id="p2" value="Sohel">
<input id="p3" placeholder="Player 3">
<input id="p4" placeholder="Player 4">
<input id="p5" placeholder="Player 5">
</div>

<div class="card">
<b>Mymensingh Stars Players</b>
<input id="b1" value="Rahul">
<input id="b2" placeholder="Player 2">
</div>

<button class="btn" onclick="start()">Start Match →</button>

<script>
function start(){
 let a=document.getElementById('teamA').value;
 let b=document.getElementById('teamB').value;
 localStorage.setItem('teamA',a);
 localStorage.setItem('teamB',b);
 localStorage.setItem('current_runs','0');
 localStorage.setItem('current_wk','0');
 localStorage.setItem('current_balls','0');
 localStorage.setItem('current_over','[]');
 location.href='scoring.html';
}
</script>
</body>
</html>
