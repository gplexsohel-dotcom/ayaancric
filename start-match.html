<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start New Match - Ayaan Cric</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;max-width:480px;margin:auto;padding:14px 14px 90px}
a{color:#aaa;text-decoration:none}
.card{background:#161616;border:1px solid #262626;border-radius:18px;padding:14px;margin:14px 0}
input{background:#0f0f0f;border:1px solid #2a2a2a;color:#fff;padding:14px;border-radius:12px;width:100%;margin:8px 0;font-size:15px}
h3{margin:6px 0 8px}
.player-row{display:flex;gap:8px;align-items:center}
.player-row input{flex:1}
.del{background:#2a2a2a;border:0;color:#ff4d4d;width:40px;height:48px;border-radius:10px;font-size:18px}
.add-btn{background:#1f1f1f;border:1px dashed #3a3a3a;color:#00e676;padding:12px;width:100%;border-radius:12px;margin-top:8px;font-weight:700}
.start-btn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#ff1a2e;color:#fff;border:0;padding:18px;font-size:18px;font-weight:800}
label{color:#777;font-size:13px;margin-left:4px}
</style>
</head>
<body>
<a href="index.html">← Back</a> <b style="margin-left:8px">Start New Match</b>

<div class="card">
<label>Team A Name</label>
<input id="teamAName" value="AYAN XI">
<label>Team B Name</label>
<input id="teamBName" value="Mymensingh Stars">
</div>

<div class="card">
<h3 id="titleA">AYAN XI Players</h3>
<div id="teamAPlayers"></div>
<button class="add-btn" onclick="addPlayer('A')">+ Add Player to AYAN XI</button>
</div>

<div class="card">
<h3 id="titleB">Mymensingh Stars Players</h3>
<div id="teamBPlayers"></div>
<button class="add-btn" onclick="addPlayer('B')">+ Add Player to Mymensingh Stars</button>
</div>

<button class="start-btn" onclick="startMatch()">Start Match →</button>

<script>
let countA=0, countB=0;
function createRow(team, value='', placeholder){
  const div=document.createElement('div');
  div.className='player-row';
  div.innerHTML=`<input placeholder="${placeholder}" value="${value}"><button class="del" onclick="this.parentElement.remove()">×</button>`;
  return div;
}
function addPlayer(team){
  if(team==='A'){
    countA++; 
    document.getElementById('teamAPlayers').appendChild(createRow('A','','Player '+countA));
  } else {
    countB++;
    document.getElementById('teamBPlayers').appendChild(createRow('B','','Player '+countB));
  }
}
function init(){
  // Team A - start with 2
  ['Ayaan','Sohel'].forEach((n,i)=>{countA=i+1; document.getElementById('teamAPlayers').appendChild(createRow('A',n,'Player '+(i+1)))});
  for(let i=0;i<3;i++) addPlayer('A'); // extra empty to show unlimited concept
  // Team B - start with 1
  ['Rahul'].forEach((n,i)=>{countB=i+1; document.getElementById('teamBPlayers').appendChild(createRow('B',n,'Player '+(i+1)))});
  for(let i=0;i<1;i++) addPlayer('B');
}
function startMatch(){
  const getPlayers=(id)=>[...document.getElementById(id).querySelectorAll('input')].map(i=>i.value.trim()).filter(v=>v);
  const data={
    teamA: document.getElementById('teamAName').value || 'AYAN XI',
    teamB: document.getElementById('teamBName').value || 'Mymensingh Stars',
    playersA: getPlayers('teamAPlayers'),
    playersB: getPlayers('teamBPlayers')
  };
  if(data.playersA.length<2 || data.playersB.length<2){alert('Add at least 2 players per team');return;}
  localStorage.setItem('ayaan_match',JSON.stringify(data));
  location.href='scoring.html';
}
document.getElementById('teamAName').addEventListener('input',e=>document.getElementById('titleA').innerText=(e.target.value||'Team A')+' Players');
document.getElementById('teamBName').addEventListener('input',e=>document.getElementById('titleB').innerText=(e.target.value||'Team B')+' Players');
init();
</script>
</body>
</html>
